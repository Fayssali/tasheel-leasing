name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_dev
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL_ADMIN: postgresql://tasheel_admin:tasheel_admin_dev@localhost:5432/tasheel
      DATABASE_URL: postgresql://tasheel_app:tasheel_app_dev@localhost:5432/tasheel

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env

      - name: Create database roles
        run: PGPASSWORD=postgres_dev psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f infra/docker/postgres/init/01-roles.sql

      - name: Apply migrations
        run: pnpm db:deploy

      - name: Build
        run: pnpm build

      - name: Unit and API tests
        run: pnpm --filter @tasheel/shared --filter @tasheel/api --filter @tasheel/i18n test

      - name: Tenant isolation — SQL suite
        run: pnpm --filter @tasheel/db test:rls

      - name: Tenant isolation — Prisma suite
        run: pnpm --filter @tasheel/db test

      - name: Seed
        run: pnpm db:seed

      - name: API integration tests (auth flow on PostgreSQL + RLS)
        run: pnpm --filter @tasheel/api test:int

      - name: Formatting
        run: pnpm format:check

  # Builds both production images and starts them the way infra/production does:
  # production database initialisation, migrations from the API image, API in production
  # mode, web (Nginx) in front. Nothing is pushed or deployed.
  container-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      ADMIN_PW: ci-admin-0123456789abcdef
      APP_PW: ci-app-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          tags: tasheel/api:ci
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          tags: tasheel/web:ci
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Start PostgreSQL with the production initialisation
        run: |
          docker network create tasheel
          docker run -d --name postgres --network tasheel \
            -e POSTGRES_PASSWORD=ci-super -e TASHEEL_ADMIN_PASSWORD=$ADMIN_PW -e TASHEEL_APP_PASSWORD=$APP_PW \
            -v "$PWD/infra/production/postgres-init:/docker-entrypoint-initdb.d:ro" postgres:16-alpine
          for i in $(seq 1 30); do docker exec postgres pg_isready -U postgres -d tasheel && break; sleep 2; done

      - name: Apply migrations from the API image
        run: |
          docker run --rm --network tasheel -w /app/packages/db \
            -e DATABASE_URL=postgresql://tasheel_app:$APP_PW@postgres:5432/tasheel \
            -e DATABASE_URL_ADMIN=postgresql://tasheel_admin:$ADMIN_PW@postgres:5432/tasheel \
            tasheel/api:ci npx prisma migrate deploy

      - name: Production configuration is refused when unsafe
        run: |
          status=0
          docker run --rm -e NODE_ENV=production -e DATABASE_URL=postgresql://x -e JWT_ACCESS_SECRET=change-me-access tasheel/api:ci > out.txt 2>&1 || status=$?
          cat out.txt
          test "$status" -ne 0 || { echo "the API started with an unsafe configuration"; exit 1; }
          grep -q "Unsafe production configuration" out.txt

      - name: Start API and web in production mode
        run: |
          docker run -d --name api --network tasheel \
            -e NODE_ENV=production -e TRUST_PROXY=1 \
            -e DATABASE_URL=postgresql://tasheel_app:$APP_PW@postgres:5432/tasheel \
            -e JWT_ACCESS_SECRET=$(openssl rand -hex 32) -e MFA_ENCRYPTION_KEY=$(openssl rand -base64 32) \
            -e WEB_APP_URL=https://app.example.test -e API_CORS_ORIGIN=https://app.example.test \
            -e S3_ENDPOINT=http://minio:9000 -e S3_BUCKET_DOCUMENTS=tasheel-documents -e S3_ACCESS_KEY=ci -e S3_SECRET_KEY=ci-secret \
            -e SMTP_HOST=mail -e MAIL_FROM=no-reply@example.test -e SCAN_MODE=clamav -e CLAMAV_HOST=clamav \
            tasheel/api:ci
          docker run -d --name web --network tasheel -p 8080:8080 tasheel/web:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/api/v1/health && break; sleep 2; done

      - name: Smoke test through Nginx
        run: |
          set -x
          curl -fsS http://localhost:8080/api/v1/health | grep -q '"database":"up"'
          curl -fsS http://localhost:8080/api/v1/health/live | grep -q '"status":"ok"'
          curl -fsS http://localhost:8080/app/billing | grep -q '<div id="root">'
          curl -sI http://localhost:8080/ | grep -qi "content-security-policy: default-src 'self'"
          curl -sI http://localhost:8080/ | grep -qi "x-content-type-options: nosniff"
          curl -sI http://localhost:8080/api/v1/health | grep -qi "x-request-id"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/billing/invoices)" = 401
          docker run --rm --network tasheel postgres:16-alpine sh -c \
            "PGPASSWORD=$APP_PW psql -h postgres -U tasheel_app -d tasheel -tAc 'select rolbypassrls from pg_roles where rolname = current_user'" | grep -qx f

      - name: Container logs
        if: always()
        run: docker logs api 2>&1 | tail -50; docker logs web 2>&1 | tail -20

      # Only after the smoke test passed, and only from main: publish the tested images to
      # the private GitHub registry, tagged with the commit and "main". Nothing is deployed.
      - name: Log in to the GitHub registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish images
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "OWNER=$OWNER" >> "$GITHUB_ENV"
          for name in api web; do
            for tag in ${{ github.sha }} main; do
              docker tag tasheel/$name:ci ghcr.io/$OWNER/tasheel-$name:$tag
              docker push ghcr.io/$OWNER/tasheel-$name:$tag
            done
          done

      - name: Build and publish the tools image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: tools
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/tasheel-tools:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/tasheel-tools:main
          cache-from: type=gha,scope=api
