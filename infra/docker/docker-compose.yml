# Local development infrastructure only. Not a production deployment.
name: tasheel

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev
      POSTGRES_DB: postgres
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tasheel
      MINIO_ROOT_PASSWORD: tasheel_minio_dev
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

  # Antivirus scanning for uploaded documents. Heavy (~1 GB RAM): start with
  # `docker compose --profile scan up -d` when working on the document module.
  clamav:
    image: clamav/clamav:stable
    profiles: ['scan']
    ports:
      - '3310:3310'

volumes:
  pgdata:
  miniodata:
