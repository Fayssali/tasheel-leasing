# EXAMPLE production layout for a single host. Not deployed anywhere by this repository.
# Read docs/operations/deployment-checklist.md before using it; nothing here is run in CI
# except the image builds and the API start-up smoke test.
#
#   cp infra/production/env.production.example infra/production/.env.production   # fill it in
#   docker compose -f infra/production/docker-compose.example.yml --env-file infra/production/.env.production up -d
#
# Traffic: Internet → caddy (TLS, :443) → web (Nginx: app + /api proxy) → api.
# Only caddy publishes ports. PostgreSQL, MinIO and ClamAV are reachable only inside the network.
name: tasheel

x-api-env: &api-env
  NODE_ENV: production
  API_PORT: 3000
  TRUST_PROXY: 2 # caddy + web (Nginx)
  DATABASE_URL: postgresql://tasheel_app:${TASHEEL_APP_PASSWORD}@postgres:5432/tasheel
  DATABASE_URL_ADMIN: postgresql://tasheel_admin:${TASHEEL_ADMIN_PASSWORD}@postgres:5432/tasheel
  WEB_APP_URL: https://${TASHEEL_DOMAIN}
  API_CORS_ORIGIN: https://${TASHEEL_DOMAIN}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY}
  S3_ENDPOINT: http://minio:9000
  S3_REGION: ${S3_REGION:-dz-1}
  S3_BUCKET_DOCUMENTS: tasheel-documents
  S3_ACCESS_KEY: ${MINIO_ROOT_USER}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  MAIL_FROM: ${MAIL_FROM}
  SCAN_MODE: clamav
  CLAMAV_HOST: clamav
  CLAMAV_PORT: 3310

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      TASHEEL_DOMAIN: ${TASHEEL_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [web]

  web:
    image: ${REGISTRY:-tasheel}/web:${TASHEEL_VERSION:?set TASHEEL_VERSION in .env.production}
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }

  api:
    image: ${REGISTRY:-tasheel}/api:${TASHEEL_VERSION:?set TASHEEL_VERSION in .env.production}
    restart: unless-stopped
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      clamav: { condition: service_healthy }
      minio-setup: { condition: service_completed_successfully }

  # One-off: applies pending migrations as tasheel_admin, then exits. The API starts after it.
  migrate:
    image: ${REGISTRY:-tasheel}/api:${TASHEEL_VERSION:?set TASHEEL_VERSION in .env.production}
    restart: 'no'
    environment: *api-env
    working_dir: /app/packages/db
    command: ['npx', 'prisma', 'migrate', 'deploy']
    depends_on:
      postgres: { condition: service_healthy }

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: postgres
      TASHEEL_ADMIN_PASSWORD: ${TASHEEL_ADMIN_PASSWORD}
      TASHEEL_APP_PASSWORD: ${TASHEEL_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d tasheel']
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data

  # One-off: creates the private documents bucket (the API never creates it in production).
  minio-setup:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: 'no'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done
        && mc mb --ignore-existing local/tasheel-documents
        && mc anonymous set none local/tasheel-documents
    depends_on: [minio]

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

volumes:
  pgdata:
  miniodata:
  clamav-db:
  caddy-data:
